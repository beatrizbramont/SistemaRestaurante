<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Verificação</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/otp.css') }}">
</head>
<body>

<div class="container">
    <form method="POST" class="card">
        {{ form.hidden_tag() }}

        <h2>Verificação de Segurança</h2>
        <p>Digite o código enviado para seu e-mail</p>

        <div class="input-group">
            {{ form.codigo.label(class="label") }}
            {{ form.codigo(class="input-field", placeholder="000000") }}
        </div>

        {{ form.submit(class="btn-submit") }}
    </form>
</div>

</body>
</html>
