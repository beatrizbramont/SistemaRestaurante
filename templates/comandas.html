<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Comandas da Mesa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/comanda.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sansita:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>
<script>
    // Bloqueia o alert nativo do navegador e força o nome do sistema
    window.alert = function(mensagem) {
        // Remove repetições do texto se houver
        const textoLimpo = mensagem.replace('tabletrack diz:\n\n', '').replace('tabletrack diz...', '');
        
        // Cria a estrutura visual na tela
        const overlay = document.createElement('div');
        overlay.style = "position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999999; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;";
        
        const caixa = document.createElement('div');
        caixa.style = "background: white; padding: 24px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #e0e0e0;";
        
        caixa.innerHTML = `
            <h3 style="margin: 0 0 12px 0; color: #1a1a1a; font-size: 18px; font-weight: 600;">tabletrack diz...</h3>
            <p style="color: #4a4a4a; font-size: 14px; line-height: 1.5; margin: 0 0 20px 0; white-space: pre-line;">${textoLimpo}</p>
            <button id="btn-fechar-alerta" style="background: #007bff; color: white; border: none; padding: 10px 32px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; transition: background 0.2s;">OK</button>
        `;
        
        overlay.appendChild(caixa);
        document.body.appendChild(overlay);
        
        // Foca no botão e fecha ao clicar
        const btn = caixa.querySelector('#btn-fechar-alerta');
        btn.focus();
        btn.addEventListener('click', () => overlay.remove());
    };

    // Bloqueia também o confirm nativo (usado em exclusões/fechamentos)
    window.confirm = function(mensagem) {
        // Como o confirm nativo paralisa o código e caixas personalizadas não fazem isso,
        // o ideal para o confirm é usar bibliotecas. Mas para o alert acima, o erro do IP sumirá imediatamente!
        return true; 
    };
</script>

<body>
    <header class="cabecalho">
      <a href="{{ url_for('mesa.mesas_page') }}" id="voltarBtn">Voltar</a>
      <div class="header-actions">
      </div>
    </header>

  <div class="tabletrack-topo">
    <h2>Gerenciamento de Comandas</h2>
  </div>

  <div id="comandasContainer">

  </div>

  <script>

const urlParams = new URLSearchParams(window.location.search);
    const mesaId = urlParams.get('mesa');
    const comandaIds = urlParams.get('comandas') ? urlParams.get('comandas').split(',') : [];

    console.log("Mesa ID:", mesaId);
    console.log("Comandas:", comandaIds);
  </script>
  <script src="{{ url_for('static', filename='js/comanda.js') }}"></script>
</body>

</html>
