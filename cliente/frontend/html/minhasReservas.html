<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Minhas Reservas</title>
    <link rel="stylesheet" href="/css/minhasReservas.css">
    <script defer src="/js/minhasReservas.js"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
 <script>
        // Customiza o alert()
        window.alert = function(mensagem) {
            const overlay = document.createElement('div');
            overlay.style = "position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999999; display: flex; align-items: center; justify-content: center; font-family: sans-serif;";
            
            const caixa = document.createElement('div');
            caixa.style = "background: white; padding: 24px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #e0e0e0;";
            
            caixa.innerHTML = `
                <h3 style="margin: 0 0 12px 0; color: #1a1a1a; font-size: 18px; font-weight: 600;">tabletrack diz...</h3>
                <p style="color: #4a4a4a; font-size: 14px; line-height: 1.5; margin: 0 0 20px 0; white-space: pre-line;">${mensagem}</p>
                <button id="btn-fechar-alerta" style="background: #d33; color: white; border: none; padding: 10px 32px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px;">OK</button>
            `;
            
            overlay.appendChild(caixa);
            document.body.appendChild(overlay);
            
            const btn = caixa.querySelector('#btn-fechar-alerta');
            btn.focus();
            btn.addEventListener('click', () => overlay.remove());
        };

        // Customiza o confirm() de cancelamento
        window.confirm = function(mensagem) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.style = "position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999999; display: flex; align-items: center; justify-content: center; font-family: sans-serif;";
                
                const caixa = document.createElement('div');
                caixa.style = "background: white; padding: 24px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #e0e0e0;";
                
                caixa.innerHTML = `
                    <h3 style="margin: 0 0 12px 0; color: #1a1a1a; font-size: 18px; font-weight: 600;">tabletrack diz...</h3>
                    <p style="color: #4a4a4a; font-size: 14px; line-height: 1.5; margin: 0 0 20px 0;">${mensagem}</p>
                    <div style="display: flex; justify-content: center; gap: 10px;">
                        <button id="btn-confirm-sim" style="background: #d33; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500;">Sim, cancelar</button>
                        <button id="btn-confirm-nao" style="background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500;">Não</button>
                    </div>
                `;
                
                overlay.appendChild(caixa);
                document.body.appendChild(overlay);
                
                caixa.querySelector('#btn-confirm-sim').addEventListener('click', () => {
                    overlay.remove();
                    resolve(true);
                });
                
                caixa.querySelector('#btn-confirm-nao').addEventListener('click', () => {
                    overlay.remove();
                    resolve(false);
                });
            });
        };
</script>
<body>

    <header>
        <button class="voltar" onclick="window.location.href='home.html'">
            <i class="fa-solid fa-arrow-left"></i> Voltar
        </button>
        <h1>Minhas Reservas</h1>
    </header>

    <main>
        <div id="listaReservas" class="lista"></div>
        <p id="erroReservas" class="erro"></p>
    </main>

</body>
</html>
